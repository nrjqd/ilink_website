# 中文註解：前端容器的 nginx 設定，負責提供 Vite 產出的靜態網站。
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        # 中文註解：SPA 路由找不到實體檔時回到 index.html，由 React 接手判斷頁面。
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(?:css|js|mjs|png|jpg|jpeg|gif|svg|webp|ico|woff2?)$ {
        # 中文註解：靜態資源可被瀏覽器快取，降低重複載入成本。
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }
}
